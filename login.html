<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Login | InovaPan</title>
  <link rel="stylesheet" href="vendor/bootstrap.min.css"><link rel="stylesheet" href="css/estilo.css">
</head>
<body>
  <main class="container py-5" style="max-width:520px">
    <div class="card card-sistema p-4">
      <h1 class="h3 page-title">Acesso ao InovaPan</h1>
      <p class="small-muted">Entre com o usuário e a senha fornecidos pela equipe.</p>
      <div id="mensagemLogin" aria-live="polite"></div>
      <form id="formLogin">
        <label for="usuario" class="form-label">Usuário</label>
        <input id="usuario" class="form-control mb-3" autocomplete="username" maxlength="120" required>
        <label for="senha" class="form-label">Senha</label>
        <input id="senha" type="password" class="form-control mb-3" autocomplete="current-password" maxlength="200" required>
        <button id="entrar" class="btn btn-brand w-100">Entrar</button>
      </form>
      <a class="mt-3 text-center" href="index.html">Voltar ao início</a>
    </div>
  </main>
  <script src="js/config.js"></script><script src="js/api.js"></script><script src="js/login.js"></script>
</body>
</html>
